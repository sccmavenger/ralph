name: Refresh Knowledge Base

on:
  schedule:
    # Small resumable creator slices run often enough to absorb new uploads
    # and recover a backlog without exceeding the web ingress timeout.
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: refresh-knowledge-base
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Refresh official game, meta, blog, and community data
        run: |
          curl --fail-with-body --show-error --silent -X POST \
            "https://themsftoolkit.com/api/cron/sync-gamedata" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 600 | tee official-sync.json
          jq -e '.summary.failed == 0' official-sync.json

      - name: Discover and ingest creator videos
        run: |
          curl --fail-with-body --show-error --silent -X POST \
            "https://themsftoolkit.com/api/cron/refresh-kb" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 600 | tee creator-sync.json > /dev/null
          jq -e '.result.errors | length == 0' creator-sync.json
          jq '{videosProcessed: .result.videosProcessed, documentsUploaded: .result.documentsUploaded, skipped: (.result.skippedVideos | length), deadlineReached: .result.deadlineReached, deferredVideos: .result.deferredVideos}' creator-sync.json
