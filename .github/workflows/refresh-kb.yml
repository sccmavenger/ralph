name: Refresh Knowledge Base

on:
  schedule:
    # Small resumable creator slices run often enough to absorb new uploads
    # and recover a backlog without exceeding the web ingress timeout.
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: refresh-knowledge-base
  cancel-in-progress: false

jobs:
  official-sync:
    name: Refresh official sources
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Refresh official game, meta, blog, and community data
        run: |
          curl --fail-with-body --show-error --silent -X POST \
            "https://themsftoolkit.com/api/cron/sync-gamedata" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 600 | tee official-sync.json
          jq -e '.summary.failed == 0' official-sync.json

  creator-sync:
    name: Refresh creator transcripts
    runs-on: [self-hosted, Windows, X64, msf-kb]
    timeout-minutes: 90
    env:
      AZURE_AI_SEARCH_ENDPOINT: ${{ secrets.AZURE_AI_SEARCH_ENDPOINT }}
      AZURE_AI_SEARCH_KEY: ${{ secrets.AZURE_AI_SEARCH_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - name: Check out the current knowledge pipeline
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: msf-companion
        run: npm ci --prefer-offline --no-audit

      - name: Discover and ingest creator transcripts
        working-directory: msf-companion
        # Small steady-state batches reduce YouTube throttling; indexed video IDs
        # make this incremental, so each run naturally catches up from its checkpoint.
        run: npm run kb:refresh -- --max=5
