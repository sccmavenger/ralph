name: Refresh Knowledge Base

on:
  schedule:
    # Run every 12 hours at 6:00 AM and 6:00 PM UTC
    - cron: "0 6,18 * * *"
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: refresh-knowledge-base
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Refresh official game, meta, blog, and community data
        run: |
          curl --fail-with-body --show-error --silent -X POST \
            "https://themsftoolkit.com/api/cron/sync-gamedata" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 600 | tee official-sync.json
          jq -e '.summary.failed == 0' official-sync.json

      - name: Discover and ingest creator videos
        run: |
          curl --fail-with-body --show-error --silent -X POST \
            "https://themsftoolkit.com/api/cron/refresh-kb" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 600 | tee creator-sync.json
          jq -e '.result.errors | length == 0' creator-sync.json
