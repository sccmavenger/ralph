name: M1.3 Bootstrap Validation

on:
  workflow_dispatch:
    inputs:
      run_genuine_source:
        description: "Run the protected genuine-source rehearsal lane (requires configured environment secrets)."
        required: false
        default: false
        type: boolean
  push:
    branches: [executive/m1.3-bootstrap]
    paths:
      - .github/workflows/m1-3-bootstrap-validation.yml
      - msf-companion/src/lib/executive/**
      - msf-companion/scripts/executive/**
      - msf-companion/tests/executive/**
      - msf-companion/package*.json
      - msf-companion/docs/executive-office/charter/**

permissions:
  contents: read

concurrency:
  group: m1-3-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synthetic-validation:
    # This lane uses synthetic bootstrap fixtures, never the private Charter.
    # Catalog artifacts are independently reviewed; runtime never learns trust
    # from a target database or auto-imports a captured artifact.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NODE_ENV: test
      POSTGRES_IMAGE: postgres:16-bookworm@sha256:efedf3595f1d6f415c08568ba171029bf54052e754cc9f030e3f2412b21f3d67
      ACCEPTED_COMMIT: 516fb3c157b703f729fc742a4b13f9ea5deef36a
      BASELINE_COMMIT: 15795cfd9cad5b54bf37a9d945d184841053574d
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgresql://inert:inert@127.0.0.1:1/inert
      SESSION_SECRET: m13-ci-session-dummy-not-a-production-secret
      ADMIN_SESSION_SECRET: m13-ci-admin-dummy-not-a-production-secret
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: msf-companion/.node-version
      - name: Confirm unchanged accepted migrations and install locked runner
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          node --version > evidence/node.txt
          npm --version > evidence/npm.txt
          git diff --exit-code "$ACCEPTED_COMMIT" -- msf-companion/prisma
          cd msf-companion
          npm ci --no-audit --no-fund
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const manifest=JSON.parse(readFileSync('src/lib/executive/m1-2-readiness-manifest.json','utf8'));
          for(const item of manifest.migrations) {
            const bytes=readFileSync(`prisma/migrations/${item.name}/migration.sql`);
            assert.equal(createHash('sha256').update(bytes).digest('hex'),item.checksum);
          }
          NODE
      - name: Create task-owned disposable PostgreSQL 16
        id: database
        run: |
          db_name="msf_exec_m12_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          admin_password=$(openssl rand -hex 24)
          migrator_password=$(openssl rand -hex 24)
          app_password=$(openssl rand -hex 24)
          echo "::add-mask::$admin_password"
          echo "::add-mask::$migrator_password"
          echo "::add-mask::$app_password"
          docker pull "$POSTGRES_IMAGE"
          docker run --detach --name msf-m13-catalog --label "msf.m13.run=$GITHUB_RUN_ID" \
            --publish 127.0.0.1:55432:5432 --env POSTGRES_PASSWORD="$admin_password" "$POSTGRES_IMAGE"
          ready=false
          for attempt in $(seq 1 30); do
            if docker exec msf-m13-catalog pg_isready -U postgres; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          docker exec -i msf-m13-catalog psql -U postgres -v ON_ERROR_STOP=1 <<SQL
          CREATE ROLE exec_test_migrator LOGIN NOSUPERUSER CREATEDB PASSWORD '$migrator_password';
          CREATE ROLE exec_test_app LOGIN NOSUPERUSER NOCREATEDB PASSWORD '$app_password';
          CREATE DATABASE "$db_name" OWNER exec_test_migrator;
          SQL
          echo "EXECUTIVE_TEST_DATABASE_URL=postgresql://exec_test_app:$app_password@127.0.0.1:55432/$db_name" >> "$GITHUB_ENV"
          echo "EXECUTIVE_TEST_MIGRATION_DATABASE_URL=postgresql://exec_test_migrator:$migrator_password@127.0.0.1:55432/$db_name" >> "$GITHUB_ENV"
          echo "EXECUTIVE_TEST_DATABASE_CONFIRM=$db_name" >> "$GITHUB_ENV"
          docker exec msf-m13-catalog psql -U postgres -Atc 'SELECT version()' > evidence/postgres-version.txt
          docker image inspect "$POSTGRES_IMAGE" --format '{{.Id}} {{json .RepoDigests}}' > evidence/postgres-image.txt
      - name: Replay accepted migrations using guarded test configuration
        working-directory: msf-companion
        run: |
          node node_modules/prisma/build/index.js migrate deploy --config prisma.executive-test.config.ts
          node node_modules/prisma/build/index.js migrate status --config prisma.executive-test.config.ts
      - name: Collect deterministic SELECT-only catalog for independent review
        working-directory: msf-companion
        run: |
          node --import tsx --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import assert from 'node:assert/strict';
          import { connectTestDatabase } from './tests/executive/test-database.ts';
          import { collectExecutiveCatalog } from './src/lib/executive/readiness.ts';
          const client=await connectTestDatabase('migrator');
          try {
            await client.query('BEGIN ISOLATION LEVEL REPEATABLE READ READ ONLY');
            await client.query('SET LOCAL search_path=pg_catalog');
            const catalog=await collectExecutiveCatalog(async(sql,values)=>(await client.query(sql,values)).rows);
            assert.equal(catalog.tables.length,11);
            assert.equal(catalog.columns.length,116);
            assert.equal(catalog.constraints.filter(x=>x.type==='c').length,43);
            assert.equal(catalog.constraints.filter(x=>x.type==='f').length,20);
            assert.equal(catalog.constraints.filter(x=>x.type==='p').length,11);
            assert.equal(catalog.indexes.length,52);
            assert.equal(catalog.functions.length,8);
            assert.equal(catalog.triggers.filter(x=>!x.internal).length,26);
            assert.equal(catalog.triggers.filter(x=>x.internal).length,80);
            assert.equal(catalog.sequences.length,1);
            const header=JSON.parse(readFileSync('src/lib/executive/m1-2-readiness-manifest.json','utf8'));
            if(header.catalog) assert.deepEqual(catalog,header.catalog,'reviewed catalog must match; never update expectations automatically');
            const bytes=JSON.stringify({...header,catalog},null,2)+'\n';
            writeFileSync('../evidence/m1-2-readiness-manifest.json',bytes);
            writeFileSync('../evidence/catalog.sha256',createHash('sha256').update(bytes).digest('hex')+'\n');
            console.log(JSON.stringify({status:'CATALOG_CAPTURED',tables:11,columns:116,checks:43,foreignKeys:20,indexes:52,functions:8,customTriggers:26,internalTriggers:80,sequences:1}));
          } finally {
            try { await client.query('ROLLBACK'); } finally { await client.end(); }
          }
          NODE
      - name: Generate client, grant disposable-test DML and run Executive acceptance suites
        working-directory: msf-companion
        run: |
          set -o pipefail
          node node_modules/prisma/build/index.js validate --config prisma.executive-test.config.ts
          node node_modules/prisma/build/index.js generate --config prisma.executive-test.config.ts
          node --input-type=module <<'NODE'
          import { connectTestDatabase, grantTestApplicationAccess } from './tests/executive/test-database.ts';
          const client=await connectTestDatabase('migrator');
          try { await grantTestApplicationAccess(client,{allowTruncate:true}); } finally { await client.end(); }
          NODE
          node node_modules/vitest/vitest.mjs run --config vitest.executive.config.ts \
            --reporter=default --reporter=json --outputFile=../evidence/executive-tests.json 2>&1 | tee ../evidence/executive-tests.log
      - name: Preserve generated migration test copies outside application discovery
        if: always()
        run: |
          source="$GITHUB_WORKSPACE/msf-companion/test-results/executive-migrations"
          target="$GITHUB_WORKSPACE/evidence/migration-rehearsals"
          if [ -d "$source" ]; then
            test ! -e "$target"
            mv -- "$source" "$target"
          fi
      - name: Targeted lint and application typecheck
        working-directory: msf-companion
        run: |
          set -o pipefail
          node node_modules/eslint/bin/eslint.js src/lib/executive scripts/executive tests/executive prisma.executive-test.config.ts vitest.executive.config.ts 2>&1 | tee ../evidence/targeted-lint.log
          node node_modules/typescript/bin/tsc --noEmit --incremental false 2>&1 | tee ../evidence/candidate-typecheck.log
      - name: Baseline and candidate web regression comparison
        env:
          NODE_ENV: production
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/m13-baseline"
          git archive "$BASELINE_COMMIT" msf-companion | tar -x -C "$RUNNER_TEMP/m13-baseline"
          baseline="$RUNNER_TEMP/m13-baseline/msf-companion"
          candidate="$GITHUB_WORKSPACE/msf-companion"
          evidence="$GITHUB_WORKSPACE/evidence"
          (cd "$baseline" && npm ci --include=dev --no-audit --no-fund && node node_modules/prisma/build/index.js generate) 2>&1 | tee "$evidence/install-baseline.log"
          (cd "$baseline" && node node_modules/typescript/bin/tsc --noEmit --incremental false && npm run build) 2>&1 | tee "$evidence/baseline-build.log"
          (cd "$candidate" && npm run build) 2>&1 | tee "$evidence/candidate-build.log"
          for mode in baseline candidate; do
            if [ "$mode" = baseline ]; then source_dir="$baseline"; else source_dir="$candidate"; fi
            (
              cd "$source_dir"
              set +e
              NODE_ENV=test node node_modules/vitest/vitest.mjs run --exclude 'functions/**' --exclude 'src/lib/wallet.test.ts' --maxWorkers=4 --reporter=json --outputFile="$evidence/$mode-web-tests.json" > "$evidence/$mode-web-tests.log" 2>&1
              tests_exit=$?
              node node_modules/eslint/bin/eslint.js --format json --output-file "$evidence/$mode-lint.json" > "$evidence/$mode-lint.log" 2>&1
              lint_exit=$?
              npm audit --json > "$evidence/$mode-dependency-audit.json"
              audit_exit=$?
              printf '{"tests":%s,"lint":%s}\n' "$tests_exit" "$lint_exit" > "$evidence/$mode-exit-codes.json"
              test "$tests_exit" -le 1 && test "$lint_exit" -le 1 && test "$audit_exit" -le 1
            )
          done
          node --input-type=module <<'NODE' | tee evidence/regression-comparison.json
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const read=n=>JSON.parse(fs.readFileSync(`evidence/${n}.json`,'utf8'));
          const tests=r=>r.testResults.flatMap(f=>f.assertionResults.map(a=>[a.fullName,a.status])).sort((a,b)=>JSON.stringify(a).localeCompare(JSON.stringify(b)));
          const baseline=read('baseline-web-tests'),candidate=read('candidate-web-tests');
          assert.deepEqual(tests(candidate),tests(baseline),'web test names/status changed');
          const lint=(report,root)=>report.flatMap(f=>f.messages.map(m=>({file:f.filePath.replace(root,'').replaceAll('\\','/'),rule:m.ruleId,severity:m.severity,line:m.line,column:m.column,message:m.message.replaceAll(root,'')}))).sort((a,b)=>JSON.stringify(a).localeCompare(JSON.stringify(b)));
          const beforeLint=read('baseline-lint'),afterLint=read('candidate-lint');
          assert.deepEqual(lint(afterLint,`${process.env.GITHUB_WORKSPACE}/msf-companion`),lint(beforeLint,`${process.env.RUNNER_TEMP}/m13-baseline/msf-companion`),'lint baseline changed');
          assert.deepEqual(read('candidate-exit-codes'),read('baseline-exit-codes'));
          const summary=r=>({passed:r.numPassedTests,failed:r.numFailedTests,total:r.numTotalTests});
          const beforeAudit=read('baseline-dependency-audit'),afterAudit=read('candidate-dependency-audit');
          assert.ok(beforeAudit.metadata?.vulnerabilities && afterAudit.metadata?.vulnerabilities,'dependency audit unavailable');
          const newlyAffected=Object.keys(afterAudit.vulnerabilities).filter(name=>!Object.hasOwn(beforeAudit.vulnerabilities,name));
          assert.deepEqual(newlyAffected,[],'newly vulnerable packages require review');
          assert.ok(!afterAudit.vulnerabilities.tsx,'operator runner security gate');
          console.log(JSON.stringify({passed:true,baseline:summary(baseline),candidate:summary(candidate),lintErrors:afterLint.reduce((n,f)=>n+f.errorCount,0),lintWarnings:afterLint.reduce((n,f)=>n+f.warningCount,0),dependencyAudit:{baseline:beforeAudit.metadata.vulnerabilities,candidate:afterAudit.metadata.vulnerabilities,newlyAffected}},null,2));
          NODE
      - name: Build current application container without publication
        run: |
          set -o pipefail
          docker build --pull --progress=plain --tag "msf-m13-check:$GITHUB_SHA" --file msf-companion/Dockerfile msf-companion 2>&1 | tee evidence/container-build.log
      - name: Application startup, readiness, route and native Sharp smoke
        run: |
          set -o pipefail
          docker run --detach --name msf-m13-app --label "msf.m13.run=$GITHUB_RUN_ID" --network none \
            --env SESSION_SECRET=m13-ci-session-dummy-not-a-production-secret \
            --env ADMIN_SESSION_SECRET=m13-ci-admin-dummy-not-a-production-secret \
            --env DATABASE_URL=postgresql://inert:inert@127.0.0.1:1/inert "msf-m13-check:$GITHUB_SHA"
          expected_node=$(tr -d '\r\n' < msf-companion/.node-version)
          docker exec -i --env EXPECTED_NODE_VERSION="$expected_node" msf-m13-app node <<'NODE' | tee evidence/container-smoke.json
          const assert=require('node:assert/strict');
          async function run(){
            assert.equal(process.version,'v'+process.env.EXPECTED_NODE_VERSION);
            assert.equal(process.getuid(),1001);
            let ready=false;
            for(let i=0;i<30;i++){
              try{const r=await fetch('http://127.0.0.1:3000/api/auth/session',{signal:AbortSignal.timeout(2000)});if(r.status===200&&(await r.json()).authenticated===false){ready=true;break;}}catch{}
              await new Promise(r=>setTimeout(r,1000));
            }
            assert.ok(ready,'readiness timed out');
            const results=[];
            const checks=[['/',200],['/faq',200],['/privacy',200],['/terms',200],['/admin',200],['/api/auth/session',200],['/api/msf/inventory',401],['/api/admin/usage-stats',401],['/subscribe',307,'/'],['/admin/dashboard',307,'/admin'],...['dashboard','inventory','roster','planner'].map(p=>['/'+p,307,'/api/auth/refresh?redirect=/dashboard'])];
            for(const [path,status,location] of checks){
              const r=await fetch('http://127.0.0.1:3000'+path,{redirect:'manual',signal:AbortSignal.timeout(10000)});
              assert.equal(r.status,status,path);
              if(location)assert.equal(r.headers.get('location'),location,path);
              if(path==='/api/auth/session')assert.deepEqual(await r.json(),{authenticated:false});
              else if(status===200)assert.match(await r.text(),/<html/);
              else await r.arrayBuffer();
              results.push({path,status});
            }
            const png=await require('sharp')({create:{width:1,height:1,channels:4,background:'red'}}).png().toBuffer();
            assert.ok(png.length);
            console.log(JSON.stringify({passed:true,node:process.version,uid:process.getuid(),readiness:true,checks:results,sharpBytes:png.length},null,2));
          }
          run().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
          test "$(docker inspect --format '{{.State.Running}}' msf-m13-app)" = true
      - name: Capture app startup diagnostics
        if: always()
        run: |
          if docker inspect msf-m13-app >/dev/null 2>&1; then
            docker logs --timestamps msf-m13-app > evidence/application.log 2>&1
            docker inspect msf-m13-app --format '{{json .State}}' > evidence/application-state.json
          fi
      - name: Remove owned disposable container
        if: always()
        run: |
          if docker inspect msf-m13-app >/dev/null 2>&1; then
            test "$(docker inspect msf-m13-app --format '{{index .Config.Labels "msf.m13.run"}}')" = "$GITHUB_RUN_ID"
            docker rm --force --volumes msf-m13-app
          fi
          if docker inspect msf-m13-catalog >/dev/null 2>&1; then
            test "$(docker inspect msf-m13-catalog --format '{{index .Config.Labels "msf.m13.run"}}')" = "$GITHUB_RUN_ID"
            docker rm --force --volumes msf-m13-catalog
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: m13-reviewed-catalog-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          retention-days: 7
          if-no-files-found: error

  genuine-source-rehearsal:
    if: github.event_name == 'workflow_dispatch' && inputs.run_genuine_source && github.ref == 'refs/heads/executive/m1.3-bootstrap'
    needs: synthetic-validation
    environment: m1-3-charter-rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NODE_ENV: test
      POSTGRES_IMAGE: postgres:16-bookworm@sha256:efedf3595f1d6f415c08568ba171029bf54052e754cc9f030e3f2412b21f3d67
      ACCEPTED_COMMIT: 516fb3c157b703f729fc742a4b13f9ea5deef36a
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: msf-companion/.node-version
      - name: Confirm unchanged accepted migrations and install locked runner
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          node --version > evidence/node.txt
          npm --version > evidence/npm.txt
          git diff --exit-code "$ACCEPTED_COMMIT" -- msf-companion/prisma
          cd msf-companion
          npm ci --no-audit --no-fund
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const manifest=JSON.parse(readFileSync('src/lib/executive/m1-2-readiness-manifest.json','utf8'));
          for(const item of manifest.migrations) {
            const bytes=readFileSync(`prisma/migrations/${item.name}/migration.sql`);
            assert.equal(createHash('sha256').update(bytes).digest('hex'),item.checksum);
          }
          NODE
      - name: Create task-owned disposable PostgreSQL 16
        id: database
        run: |
          db_name="msf_exec_m12_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          admin_password=$(openssl rand -hex 24)
          migrator_password=$(openssl rand -hex 24)
          app_password=$(openssl rand -hex 24)
          echo "::add-mask::$admin_password"
          echo "::add-mask::$migrator_password"
          echo "::add-mask::$app_password"
          docker pull "$POSTGRES_IMAGE"
          docker run --detach --name msf-m13-catalog --label "msf.m13.run=$GITHUB_RUN_ID" \
            --publish 127.0.0.1:55432:5432 --env POSTGRES_PASSWORD="$admin_password" "$POSTGRES_IMAGE"
          ready=false
          for attempt in $(seq 1 30); do
            if docker exec msf-m13-catalog pg_isready -U postgres; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          docker exec -i msf-m13-catalog psql -U postgres -v ON_ERROR_STOP=1 <<SQL
          CREATE ROLE exec_test_migrator LOGIN NOSUPERUSER CREATEDB PASSWORD '$migrator_password';
          CREATE ROLE exec_test_app LOGIN NOSUPERUSER NOCREATEDB PASSWORD '$app_password';
          CREATE DATABASE "$db_name" OWNER exec_test_migrator;
          SQL
          echo "EXECUTIVE_TEST_DATABASE_URL=postgresql://exec_test_app:$app_password@127.0.0.1:55432/$db_name" >> "$GITHUB_ENV"
          echo "EXECUTIVE_TEST_MIGRATION_DATABASE_URL=postgresql://exec_test_migrator:$migrator_password@127.0.0.1:55432/$db_name" >> "$GITHUB_ENV"
          echo "EXECUTIVE_TEST_DATABASE_CONFIRM=$db_name" >> "$GITHUB_ENV"
          docker exec msf-m13-catalog psql -U postgres -Atc 'SELECT version()' > evidence/postgres-version.txt
          docker image inspect "$POSTGRES_IMAGE" --format '{{.Id}} {{json .RepoDigests}}' > evidence/postgres-image.txt
      - name: Replay accepted migrations using guarded test configuration
        working-directory: msf-companion
        run: |
          node node_modules/prisma/build/index.js migrate deploy --config prisma.executive-test.config.ts
          node node_modules/prisma/build/index.js migrate status --config prisma.executive-test.config.ts
      - name: Generate reviewed client and grant disposable rehearsal access
        working-directory: msf-companion
        run: |
          node node_modules/prisma/build/index.js generate --config prisma.executive-test.config.ts
          node --input-type=module <<'NODE'
          import { connectTestDatabase, grantTestApplicationAccess } from './tests/executive/test-database.ts';
          const client = await connectTestDatabase('migrator');
          try { await grantTestApplicationAccess(client); } finally { await client.end(); }
          NODE
      - name: Verify original source and rehearse check, apply and no-write replay
        working-directory: msf-companion
        env:
          M13_CHARTER_SOURCE_B64_01: ${{ secrets.M13_CHARTER_SOURCE_B64_01 }}
          M13_CHARTER_SOURCE_B64_02: ${{ secrets.M13_CHARTER_SOURCE_B64_02 }}
        run: |
          node --import tsx --input-type=module <<'NODE'
          import { mkdtemp, writeFile, rm, readFile } from 'node:fs/promises';
          import { join } from 'node:path';
          import { createHash } from 'node:crypto';
          import { spawn } from 'node:child_process';
          import assert from 'node:assert/strict';
          import { connectTestDatabase, EXECUTIVE_TABLES } from './tests/executive/test-database.ts';
          let custody;
          let owner;
          try {
            const first = process.env.M13_CHARTER_SOURCE_B64_01;
            const second = process.env.M13_CHARTER_SOURCE_B64_02;
            delete process.env.M13_CHARTER_SOURCE_B64_01;
            delete process.env.M13_CHARTER_SOURCE_B64_02;
            assert.equal(first?.length, 27000);
            assert.equal(second?.length, 26980);
            const bytes = Buffer.from(first + second, 'base64');
            assert.equal(bytes.length, 40485);
            const sourceHash = createHash('sha256').update(bytes).digest('hex');
            assert.equal(sourceHash, '654a4baa4e86743af373f620a8dc156519dada487f3288811b39ae42e5413660');
            custody = await mkdtemp(join(process.env.RUNNER_TEMP, 'm13-private-source-'));
            const source = join(custody, 'MSF_Toolkit_AI_CEO_Charter_and_Governance_Framework.docx');
            const input = join(custody, 'owner.json');
            const target = join(custody, 'target.json');
            await writeFile(source, bytes, { mode: 0o600 });
            bytes.fill(0);
            await writeFile(input, JSON.stringify({ inputVersion: 1, owner: { displayName: 'Synthetic Test Owner', contactEmail: null } }), { mode: 0o600 });
            const database = process.env.EXECUTIVE_TEST_DATABASE_CONFIRM;
            await writeFile(target, JSON.stringify({ targetVersion: 1, environment: 'disposable', host: '127.0.0.1',
              port: 55432, database, role: 'exec_test_app', tls: 'disabled', runId: process.env.GITHUB_RUN_ID }), { mode: 0o600 });
            const env = { PATH: process.env.PATH, NODE_ENV: 'test',
              EXECUTIVE_BOOTSTRAP_DATABASE_URL: process.env.EXECUTIVE_TEST_DATABASE_URL,
              EXECUTIVE_BOOTSTRAP_DATABASE_CONFIRM: database };
            owner = await connectTestDatabase('migrator');
            async function snapshot() {
              const rows = {};
              for (const table of EXECUTIVE_TABLES) rows[table] = (await owner.query('SELECT row_to_json(t) AS row FROM public."' + table + '" t ORDER BY id')).rows;
              const sequence = (await owner.query('SELECT last_value,is_called FROM public."ExecutiveActivityEvent_sequence_seq"')).rows;
              return JSON.stringify({ rows, sequence });
            }
            async function invoke(mode) {
              const args = ['./node_modules/tsx/dist/cli.mjs', 'scripts/executive/bootstrap.ts', '--' + mode,
                '--input', input, '--source-file', source, '--target', target];
              if (mode === 'apply') args.push('--confirm-target', database);
              const result = await new Promise((resolve, reject) => {
                const child = spawn(process.execPath, args, { env, stdio: ['ignore', 'pipe', 'pipe'] });
                let stdout = '', stderr = '';
                const timer = setTimeout(() => { child.kill('SIGKILL'); reject(new Error('TIMEOUT')); }, 60000);
                child.stdout.on('data', b => { stdout += b; if (stdout.length > 65536) child.kill('SIGKILL'); });
                child.stderr.on('data', b => { stderr += b; if (stderr.length > 65536) child.kill('SIGKILL'); });
                child.on('error', () => { clearTimeout(timer); reject(new Error('START_FAILED')); });
                child.on('close', code => { clearTimeout(timer); resolve({ code, stdout, stderr }); });
              });
              assert.equal(result.code, 0);
              assert.equal(result.stderr, '');
              assert.equal(result.stdout.trim().split('\n').length, 1);
              assert.ok(!result.stdout.includes(custody) && !result.stdout.includes('postgresql://'));
              return JSON.parse(result.stdout);
            }
            const empty = await snapshot();
            assert.equal((await invoke('check')).status, 'READY_EMPTY');
            assert.equal(await snapshot(), empty);
            const created = await invoke('apply');
            assert.equal(created.status, 'CREATED');
            const committed = await snapshot();
            const replay = await invoke('apply');
            assert.equal(replay.status, 'ALREADY_BOOTSTRAPPED');
            for (const key of ['officeId', 'ownerId', 'ceoId', 'charterId']) assert.equal(replay[key], created[key]);
            assert.equal(await snapshot(), committed);
            assert.equal((await invoke('check')).status, 'ALREADY_BOOTSTRAPPED');
            assert.equal(await snapshot(), committed);
            for (const table of ['ExecutiveOwnerCredential','ExecutiveOwnerEnrollment','ExecutiveOwnerChallenge','ExecutiveOwnerSession','ExecutiveAuthRateLimit','ExecutiveCharterAcceptance']) {
              assert.equal((await owner.query('SELECT count(*)::int AS count FROM public."' + table + '"')).rows[0].count, 0);
            }
            const charter = (await owner.query('SELECT "contentMarkdown" FROM public."ExecutiveCharter"')).rows;
            assert.equal(charter.length, 1);
            assert.equal(charter[0].contentMarkdown, await readFile('docs/executive-office/charter/charter-v1.md', 'utf8'));
            assert.equal((await owner.query('SELECT count(*)::int AS count FROM public."ExecutiveActivityEvent"')).rows[0].count, 2);
            const agent = (await owner.query('SELECT status,"governingCharterAcceptanceId","roleDefinition" FROM public."ExecutiveAgent"')).rows;
            assert.equal(agent.length, 1);
            assert.equal(agent[0].status, 'ONBOARDING');
            assert.equal(agent[0].governingCharterAcceptanceId, null);
            assert.deepEqual(agent[0].roleDefinition.tools, []);
            assert.deepEqual(agent[0].roleDefinition.permissions, []);
            assert.equal(agent[0].roleDefinition.spendingAuthority, false);
            const evidence = { passed: true, commit: process.env.GITHUB_SHA, sourceHash, sourceBytes: 40485,
              checkNoWrites: true, applyCreated: true, replayNoWrites: true, identityPreserved: true,
              charterContentExact: true, acceptanceAbsent: true, authenticationAbsent: true };
            await writeFile('../evidence/genuine-source-rehearsal.json', JSON.stringify(evidence, null, 2) + '\n');
            console.log(JSON.stringify(evidence));
          } catch {
            console.error('GENUINE_SOURCE_REHEARSAL_FAILED');
            process.exitCode = 1;
          } finally {
            try { await owner?.end(); }
            finally { if (custody) await rm(custody, { recursive: true, force: true }); }
          }
          NODE
      - name: Verify source cleanup and remove owned disposable container
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import { readdir, rm } from 'node:fs/promises';
          import { join } from 'node:path';
          for (const name of await readdir(process.env.RUNNER_TEMP)) {
            if (name.startsWith('m13-private-source-')) await rm(join(process.env.RUNNER_TEMP, name), { recursive: true, force: true });
          }
          if ((await readdir(process.env.RUNNER_TEMP)).some(name => name.startsWith('m13-private-source-'))) process.exitCode = 1;
          NODE
          if docker inspect msf-m13-catalog >/dev/null 2>&1; then
            test "$(docker inspect msf-m13-catalog --format '{{index .Config.Labels "msf.m13.run"}}')" = "$GITHUB_RUN_ID"
            docker rm --force --volumes msf-m13-catalog
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: m13-genuine-source-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/commit.txt
            evidence/node.txt
            evidence/npm.txt
            evidence/postgres-version.txt
            evidence/postgres-image.txt
            evidence/genuine-source-rehearsal.json
          retention-days: 7
          if-no-files-found: error
