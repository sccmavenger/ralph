name: Codex M1 Development Agent
on:
  workflow_dispatch:
    inputs:
      cycle:
        description: 'Bounded autonomous development cycle (1-4)'
        required: false
        default: '1'
        type: string
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: codex-m1-development
  cancel-in-progress: false

jobs:
  develop:
    if: github.repository == 'sccmavenger/ralph' && (github.event_name == 'workflow_dispatch' || vars.CODEX_M1_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Check API credential
        env:
          CODEX_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$CODEX_KEY" ]; then
            echo "::error::Configure OPENAI_API_KEY in GitHub Actions secrets before running Codex."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Prepare M1.3 implementation checkout
        shell: bash
        run: |
          set -euo pipefail
          cp .github/codex/m1-agent.md /tmp/m1-agent.md
          git fetch --no-tags origin refs/heads/executive/m1.3-bootstrap
          git checkout --detach FETCH_HEAD
          mkdir -p .github/codex
          cp /tmp/m1-agent.md .github/codex/m1-agent.md
      - name: Run Codex on M1
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':workspace'
          safety-strategy: drop-sudo
          allow-bots: true
          prompt-file: .github/codex/m1-agent.md
          working-directory: .
      - name: Save code-only patch
        if: success()
        shell: bash
        run: |
          git add -N -- . ':!.github/workflows/**' ':!.github/codex/**' ':!msf-companion/docs/executive-office/charter/**' ':!msf-companion/src/lib/executive/bootstrap-role-v1.json'
          git diff --binary -- . ':!.github/workflows/**' ':!.github/codex/**' ':!msf-companion/docs/executive-office/charter/**' ':!msf-companion/src/lib/executive/bootstrap-role-v1.json' > /tmp/m1.patch
          cp /tmp/m1.patch m1.patch
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: codex-m1-patch
          path: m1.patch
          retention-days: 3
          if-no-files-found: error

  publish:
    needs: develop
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: executive/m1.3-bootstrap
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: codex-m1-patch
      - name: Apply patch and commit to agent branch
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s m1.patch ]; then
            echo "No changes proposed."
            exit 0
          fi
          git apply --check m1.patch
          git apply m1.patch
          rm m1.patch
          git add -A
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Codex: M1 development checkpoint"
          git push origin HEAD:executive/m1.3-bootstrap

  validate:
    needs: publish
    if: ${{ needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: executive/m1.3-bootstrap
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: msf-companion/package-lock.json
      - name: Install dependencies
        working-directory: msf-companion
        run: npm ci
      - name: Run source-free M1.3 unit checks
        working-directory: msf-companion
        run: |
          cat > ralph-executive-vitest.config.mts <<'EOF'
          import { defineConfig } from "vitest/config";
          export default defineConfig({ test: { include: ["tests/executive/**/*.test.ts"], exclude: ["node_modules/**"] } });
          EOF
          npx vitest run --config ralph-executive-vitest.config.mts tests/executive --exclude="**/*.integration.test.ts"
      - name: Continue bounded M1.3 development immediately
        if: success() && github.event_name == 'workflow_dispatch' && fromJSON(inputs.cycle || '1') < 4
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_CYCLE: ${{ inputs.cycle || '1' }}
        run: |
          next=$((CURRENT_CYCLE + 1))
          gh workflow run codex-m1-development.yml --ref main -f cycle="$next"
          echo "Triggered M1.3 development cycle $next of 4" >> "$GITHUB_STEP_SUMMARY"
      - name: Record immediate run result
        if: always()
        shell: bash
        run: |
          echo "### Ralph M1.3 development checkpoint" >> "$GITHUB_STEP_SUMMARY"
          echo "Publish: ${{ needs.publish.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Validation: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Implementation: https://github.com/sccmavenger/ralph/pull/11" >> "$GITHUB_STEP_SUMMARY"
